name: R quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Validate repository quality
        run: Rscript scripts/validate_repository_quality.R

  unit-and-cli-tests:
    name: Unit and CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            echo "apt-get update attempt ${attempt}/3"
            if sudo timeout --kill-after=10s 90s apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update failed or timed out after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          sudo timeout --kill-after=10s 180s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends libglpk40

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Verify renv status
        run: Rscript -e "renv::status()"

      - name: Validate reproducibility contract
        run: Rscript scripts/validate_reproducibility_contract.R

      - name: Run unit and CLI tests
        run: Rscript scripts/run_unit_tests.R

      - name: Validate publication readiness
        run: Rscript scripts/validate_publication_readiness.R

      - name: Validate Git whitespace
        shell: bash
        run: git diff --check
